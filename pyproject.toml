[project]
name = "upheld"
version = "0.1.0"
description = "Check whether an AI answer's citations actually support its claims."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Varun S G", email = "varun.g.ug23@plaksha.edu.in" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.2",
    "rank-bm25>=0.2.2",
    "rich>=15.0.0",
    "trafilatura>=2.3.1",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
    "wordfreq>=3.1.1",
]

[project.urls]
Repository = "https://github.com/warun7/upheld"

[project.scripts]
upheld = "upheld.cli:app"

[project.optional-dependencies]
lettuce = [
    "lettucedetect>=0.2.3",
]
dense = [
    "sentence-transformers>=6.2.0",
]
minicheck = [
    "torch>=2.15.0",
    "transformers>=5.22.1",
]
collect = [
    "anthropic>=1.0",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "scikit-learn>=1.9.1",
]
