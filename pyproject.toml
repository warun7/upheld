[project]
name = "upheld"
version = "0.2.0"
description = "Check whether an AI answer's citations actually support its claims."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Varun S G", email = "varun.g.ug23@plaksha.edu.in" }
]
requires-python = ">=3.12"
keywords = ["citations", "attribution", "fact-checking", "hallucination", "rag", "llm", "evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.21",
    "numpy>=1.26",
    "pydantic>=2.0.2",
    "pypdf>=3.1",
    "rank-bm25>=0.2.2",
    "rich>=10.11",
    "trafilatura>=1.0",
    "typer>=0.15.4",
    "wordfreq>=3.1",
]

[project.urls]
Homepage = "https://upheld.varunsg.com"
Documentation = "https://upheld.varunsg.com/docs/"
Repository = "https://github.com/warun7/upheld"
Issues = "https://github.com/warun7/upheld/issues"

[project.scripts]
upheld = "upheld.cli:app"

[project.optional-dependencies]
lettuce = [
    "lettucedetect>=0.1.7",
]
dense = [
    "sentence-transformers>=2.3",
]
minicheck = [
    "torch>=2.2",
    "transformers>=4.34",
]
judge = [
    "llama-cpp-python>=0.3.2",
    "transformers>=4.47",
]
# upheld serve: the HTTP API and the website.
api = [
    "fastapi>=0.100",
    "uvicorn>=0.20",
]
# upheld mcp: the MCP server for AI agents.
mcp = [
    "mcp>=2.0.0",
]
# Everything the default ensemble and hybrid retrieval need; the judge builds llama.cpp, so it stays separate.
models = [
    "upheld[minicheck,lettuce,dense]",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "scikit-learn>=1.9.1",
    "upheld[api,mcp]",
]
