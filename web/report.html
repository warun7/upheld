<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="generator" content="upheld" />
    <title>upheld report</title>
    <!-- Dark when the reader's system is, and always light on paper. -->
    <script>try{var d=document.documentElement,m=matchMedia("(prefers-color-scheme: dark)");if(m.matches)d.dataset.theme="dark";addEventListener("beforeprint",function(){delete d.dataset.theme});addEventListener("afterprint",function(){if(m.matches)d.dataset.theme="dark"})}catch(e){}</script>
  </head>
  <body>
    <div id="root"><noscript><p style="padding:2rem;font-family:sans-serif">This report needs JavaScript to display. Its data is the JSON in the upheld-data script inside this file.</p></noscript></div>
    <!-- `upheld audit --html` puts the audit here. -->
    <script id="upheld-data" type="application/json">{}</script>
    <script type="module" src="/src/report.tsx"></script>
  </body>
</html>
