# Tests and the site build on every push and pull request.
# Publishing is separate: .github/workflows/publish.yml, on a version tag.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor and the ceiling pyproject.toml claims: requires-python >=3.12, classifiers up to 3.14.
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest -q

  action:
    name: GitHub Action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The lexical verifier and inline sources: no models, no network, so this tests the action, not the verifiers.
      - name: Passes when no claim has a failing verdict
        id: pass
        uses: ./
        with:
          files: examples/glp1.json
          verifier: lexical
          retrieval: bm25
          fetch: "false"
          fail-on: source_missing
          report-name: upheld-reports-pass
      - name: Fails on flagged claims
        id: flagged
        continue-on-error: true
        uses: ./
        with:
          files: examples/glp1.json
          verifier: lexical
          retrieval: bm25
          fetch: "false"
          report-name: upheld-reports-flagged
      - name: Check the outcomes
        env:
          FLAGGED: ${{ steps.flagged.outcome }}
          FAILED: ${{ steps.flagged.outputs.failed }}
          REPORTS: ${{ steps.pass.outputs.report-dir }}
        run: |
          test "$FLAGGED" = failure || { echo "::error::the flagged run should have failed"; exit 1; }
          test "$FAILED" = 1 || { echo "::error::expected 1 failing answer, got '$FAILED'"; exit 1; }
          test -s "$REPORTS/examples_glp1.json.html" && test -s "$REPORTS/examples_glp1.json.json"

  web:
    name: Site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Typecheck, bundle, then prerender every page. A broken import or a page that can't render statically fails here.
      - run: npm run build
      - name: The build is static
        run: |
          test -f dist/index.html
          test -f dist/docs/index.html
          test -f dist/404.html
          test ! -e dist/app
          # No playground page. The word survives in the 404 page's search keys, which point /playground at the
          # real reports on purpose, so this checks the pages rather than every byte of the build.
          ! grep -rl "playground" dist --include="*.html"
      # upheld audit --html fills in src/upheld/report.html, which this build writes. The committed copy must match it.
      - name: The packaged report template is up to date
        run: |
          if ! git diff --quiet -- ../src/upheld/report.html; then
            echo "::error file=src/upheld/report.html::stale: run npm run build in web/ and commit src/upheld/report.html"
            exit 1
          fi
